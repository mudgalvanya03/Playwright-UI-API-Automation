name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - staging

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create env file from secrets
        run: |
          mkdir -p config
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> config/.env.local
          echo "API_URL=${{ secrets.API_URL }}" >> config/.env.local
          echo "ENVIRONMENT=local" >> config/.env.local
          echo "TIMEOUT_MS=30000" >> config/.env.local
          echo "HEADLESS=true" >> config/.env.local
          echo "REQRES_API_KEY=${{ secrets.REQRES_API_KEY }}" >> config/.env.local
          echo "MOCK_SERVER_URL=http://localhost:3001" >> config/.env.local

      - name: Run UI tests
        run: ENV=local npx playwright test tests/UI --project=chromium

      - name: Run API tests
        run: ENV=local npx playwright test tests/API/users.spec.ts tests/API/auth.spec.ts tests/API/contracts.spec.ts --project=chromium

      - name: Start mock server
        run: npm run mock-server &

      - name: Wait for mock server
        run: npx wait-on http://localhost:3001

      - name: Run mock server tests
        run: ENV=local npx playwright test tests/API/mockServer.spec.ts tests/API/errorSimulation.spec.ts --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload failures JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-failures
          path: test-results/failures.json
          retention-days: 30
          if-no-files-found: ignore 